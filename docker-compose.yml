version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: warehouse_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: warehouse_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db

  adminer:
    image: adminer
    container_name: warehouse_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data: